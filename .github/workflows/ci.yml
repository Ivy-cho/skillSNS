name: CI Checks

# develop 브랜치로의 직접 push는 deploy.yml이 같은 검사를 이미 포함해서 돌리므로
# 여기선 제외한다(중복 실행 방지). 다만 develop로 들어오는 PR은 머지 전에 걸러야
# 하니 pull_request 쪽엔 남겨둔다.
on:
  push:
    branches: [backend, frontend, main]
  pull_request:
    branches: [backend, develop, frontend, main]

jobs:
  lint-backend:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, skill-service, feed-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check ${{ matrix.service }}/

  check-frontend:
    name: Typecheck + Lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src
