name: CI/CD

on:
  push:
    branches: [develop]

jobs:
  lint-backend:
    name: Lint (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.22

      - name: Run ruff
        run: ruff check user-service/ skill-service/ feed-service/

  lint-frontend:
    name: Typecheck + Lint (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

  deploy:
    name: Deploy to Render
    needs: [lint-backend, lint-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy user-service
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK_USER_SERVICE }}"

      - name: Deploy skill-service
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK_SKILL_SERVICE }}"

      - name: Deploy feed-service
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK_FEED_SERVICE }}"

      - name: Deploy frontend
        run: curl -f "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
