services:
  - type: web
    name: skillsns-user-service
    env: docker
    plan: free
    branch: backend
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: ./user-service
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CALLBACK_URL
        sync: false

  - type: web
    name: skillsns-skill-service
    env: docker
    plan: free
    branch: backend
    dockerfilePath: ./skill-service/Dockerfile
    dockerContext: ./skill-service
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6

  - type: web
    name: skillsns-feed-service
    env: docker
    plan: free
    branch: backend
    dockerfilePath: ./feed-service/Dockerfile
    dockerContext: ./feed-service
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
