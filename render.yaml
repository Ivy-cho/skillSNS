services:
  - type: web
    name: skillsns-user-service
    env: docker
    plan: free
    branch: develop
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: ./user-service
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CALLBACK_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://skillsns-frontend.onrender.com,https://skillsns.vercel.app

  - type: web
    name: skillsns-skill-service
    env: docker
    plan: free
    branch: develop
    dockerfilePath: ./skill-service/Dockerfile
    dockerContext: ./skill-service
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://skillsns-frontend.onrender.com,https://skillsns.vercel.app

  - type: web
    name: skillsns-feed-service
    env: docker
    plan: free
    branch: develop
    dockerfilePath: ./feed-service/Dockerfile
    dockerContext: ./feed-service
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://skillsns-frontend.onrender.com,https://skillsns.vercel.app

  - type: web
    name: skillsns-frontend
    env: docker
    plan: free
    branch: develop
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://skillsns-skill-service.onrender.com
      - key: NEXT_PUBLIC_USER_SERVICE_URL
        value: https://skillsns-user-service.onrender.com
      - key: NEXT_PUBLIC_FEED_SERVICE_URL
        value: https://skillsns-feed-service.onrender.com
